<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BaoziStore - Consulta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Listagem de Pedidos Efetuados</h2>
        <a th:href="@{/info/cadastro}" class="btn btn-primary">Novo Registo</a>
    </div>

    <table class="table table-hover table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Data</th>
                <th>Cliente</th>
                <th>Produto</th>
                <th>Qtd.</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${pedidos}">
                <td th:text="${#temporals.format(p.dataPedido, 'dd/MM/yyyy')}"></td>
                <td th:text="${p.nomeCliente}"></td>
                <td th:text="${p.nomeProduto}"></td>
                <td th:text="${p.quantidade}"></td>
                <td>
                    <a class="btn btn-info btn-sm" th:href="@{/info/editar/{id}(id=${p.id})}">Editar</a>
                    <a class="btn btn-danger btn-sm" th:href="@{/info/excluir/{id}(id=${p.id})}" 
                       onclick="return confirm('Confirmar exclusão do pedido?')">Excluir</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(pedidos)}">
                <td colspan="5" class="text-center">Nenhum pedido encontrado.</td>
            </tr>
        </tbody>
    </table>

<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div th:if="${fail}" class="alert alert-danger" th:text="${fail}"></div>
    <p>&copy; 2026 Anderson Oliveira Silva (4918513).</p>
</body>
</html>
